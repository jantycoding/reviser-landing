<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>Reviser — внедрение ИИ-агентов в бизнес</title>
    <meta
      name="description"
      content="Внедряем ИИ-агентов в бизнес: приём заявок за секунды в WhatsApp и Instagram, догрев клиентов, ответы на отзывы, контроль звонков и CRM. Начинается с аудита бизнеса — находим, где агент принесёт деньги именно вам."
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Reviser" />
    <meta property="og:title" content="Reviser — ИИ-агент, который не спит и не увольняется" />
    <meta
      property="og:description"
      content="Внедряем ИИ-агентов туда, где они принесут деньги. Первый шаг — аудит бизнеса по 12 направлениям."
    />
    <!--
      АБСОЛЮТНЫЙ АДРЕС КАРТИНКИ, 26.08.2026.
      WhatsApp, Telegram и Facebook не разворачивают относительный «/og.png»:
      их сборщик превью читает значение как есть, не видит домена и молча
      показывает голую ссылку. Поэтому %OG_BASE% подставляется на сборке
      плагином из vite.config.js — см. комментарий там.
      width/height позволяют мессенджеру зарезервировать место под картинку
      до того, как она скачается: превью появляется в один шаг, без прыжка.
    -->
    <meta property="og:image" content="%OG_BASE%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Reviser — ИИ-агент, который не спит и не увольняется"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@800&family=Onest:wght@400;500;600;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
